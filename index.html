<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#170a1c">
<meta name="description" content="我们的恋爱计时 · 照片墙">
<title>我们的恋爱计时</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- 背景飘落爱心 -->
<canvas id="bg-canvas" aria-hidden="true"></canvas>

<main class="page">

  <!-- ============ 顶部 ============ -->
  <header class="hero reveal">
    <div class="names">
      <span class="name" id="name-a">你</span>
      <span class="heart-beat">❤</span>
      <span class="name" id="name-b">我</span>
    </div>
    <p class="subtitle" id="subtitle"></p>
    <div class="since" id="since-text"></div>
  </header>

  <!-- ============ 倒计时 ============ -->
  <section class="counters">
    <div class="card reveal">
      <div class="card-label">我们已经在一起</div>
      <div class="days-wrap">
        <span class="days-num" id="days-num">0</span>
        <span class="days-unit">天</span>
      </div>
      <div class="exact" id="exact-time">0 时 0 分 0 秒</div>
      <div class="tiny" id="total-text"></div>
    </div>

    <div class="card reveal">
      <div class="card-label" id="next-label">下一个纪念日</div>
      <div class="cd-grid" id="next-cd">
        <div class="cd-item"><b>0</b><i>天</i></div>
        <div class="cd-item"><b>00</b><i>时</i></div>
        <div class="cd-item"><b>00</b><i>分</i></div>
        <div class="cd-item"><b>00</b><i>秒</i></div>
      </div>
      <div class="tiny" id="next-date"></div>
    </div>
  </section>

  <!-- ============ 爱心进度条 ============ -->
  <section class="progress-section reveal">
    <div class="heart-ring">
      <svg viewBox="0 0 200 200" class="heart-svg" role="img" aria-label="纪念日进度">
        <defs>
          <linearGradient id="heartGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%"   stop-color="#ff2d75"/>
            <stop offset="55%"  stop-color="#ff6fae"/>
            <stop offset="100%" stop-color="#ffd0e4"/>
          </linearGradient>
          <clipPath id="heartClip">
            <path d="M100,176 C60,141 15,106 15,66 C15,36 38,15 65,15 C82,15 95,25 100,38 C105,25 118,15 135,15 C162,15 185,36 185,66 C185,106 140,141 100,176 Z"/>
          </clipPath>
        </defs>
        <!-- 心形底 -->
        <path class="heart-base"
              d="M100,176 C60,141 15,106 15,66 C15,36 38,15 65,15 C82,15 95,25 100,38 C105,25 118,15 135,15 C162,15 185,36 185,66 C185,106 140,141 100,176 Z"/>
        <!-- 进度填充（高度由 JS 控制） -->
        <g clip-path="url(#heartClip)">
          <rect id="heart-fill" x="0" y="200" width="200" height="0" fill="url(#heartGrad)"/>
        </g>
        <!-- 描边 -->
        <path class="heart-outline"
              d="M100,176 C60,141 15,106 15,66 C15,36 38,15 65,15 C82,15 95,25 100,38 C105,25 118,15 135,15 C162,15 185,36 185,66 C185,106 140,141 100,176 Z"/>
      </svg>
    </div>
    <div class="progress-info">
      <div class="progress-pct"><span id="progress-pct">0</span><small>%</small></div>
      <div class="progress-desc">距离第 <b id="anniv-index">1</b> 个纪念日</div>
      <div class="progress-bar">
        <div class="progress-bar-inner" id="progress-bar"></div>
      </div>
      <div class="progress-range">
        <span id="range-start">—</span>
        <span id="range-end">—</span>
      </div>
    </div>
  </section>

  <!-- ============ 照片墙 ============ -->
  <section class="wall">
    <h2 class="wall-title reveal" id="wall-title">我们的照片墙</h2>
    <div class="masonry" id="masonry"></div>
    <p class="wall-empty" id="wall-empty" hidden>
      还没有照片～去 <code>assets/js/config.js</code> 里的 <code>photos</code> 添加吧
    </p>
  </section>

  <footer class="footer" id="footer-text"></footer>
</main>

<!-- ============ 灯箱 ============ -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-btn lb-close" id="lb-close" aria-label="关闭">✕</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="上一张">‹</button>
  <button class="lb-btn lb-next" id="lb-next" aria-label="下一张">›</button>
  <div class="lb-stage">
    <img id="lb-img" src="" alt="">
    <div class="lb-caption">
      <span id="lb-text"></span>
      <span class="lb-count" id="lb-count"></span>
    </div>
  </div>
</div>

<!-- 背景音乐按钮（config.musicUrl 为空时自动隐藏） -->
<button class="music-btn" id="music-btn" hidden aria-label="播放音乐">♪</button>
<audio id="music-audio" loop></audio>

<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
